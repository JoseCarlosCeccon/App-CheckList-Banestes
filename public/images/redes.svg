<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#13305a" />
      <stop offset="65%" stop-color="#0b1f3a" />
      <stop offset="100%" stop-color="#071426" />
    </radialGradient>
    <radialGradient id="emeraldHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="nodeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="nodeSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2747" />
      <stop offset="100%" stop-color="#071426" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGlow)" />
  <circle cx="300" cy="300" r="240" fill="url(#emeraldHalo)" />

  <!-- Isometric grid lines -->
  <g stroke="#14b8a6" stroke-opacity="0.14" stroke-width="1.5">
    <line x1="60" y1="300" x2="300" y2="160" />
    <line x1="120" y1="340" x2="360" y2="200" />
    <line x1="180" y1="380" x2="420" y2="240" />
    <line x1="240" y1="420" x2="480" y2="280" />
    <line x1="300" y1="460" x2="540" y2="320" />
    <line x1="300" y1="160" x2="540" y2="300" />
    <line x1="240" y1="200" x2="480" y2="340" />
    <line x1="180" y1="240" x2="420" y2="380" />
    <line x1="120" y1="280" x2="360" y2="420" />
    <line x1="60" y1="320" x2="300" y2="460" />
  </g>

  <!-- Glowing fiber cables connecting routers -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M300 280 L165 205" stroke="#34d399" stroke-width="5" />
    <path d="M300 280 L435 205" stroke="#14b8a6" stroke-width="5" />
    <path d="M300 280 L165 375" stroke="#14b8a6" stroke-width="5" />
    <path d="M300 280 L435 375" stroke="#34d399" stroke-width="5" />
    <path d="M165 205 L300 130 L435 205" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 8" />
    <path d="M165 375 L300 455 L435 375" stroke="#34d399" stroke-width="3" stroke-dasharray="6 8" />
  </g>

  <!-- Data packets on cables -->
  <circle cx="225" cy="238" r="6" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="375" cy="238" r="6" fill="#34d399" filter="url(#glow)" />
  <circle cx="225" cy="333" r="6" fill="#34d399" filter="url(#glow)" />
  <circle cx="375" cy="333" r="6" fill="#fbbf24" filter="url(#glow)" />

  <!-- Top Globe Node -->
  <g transform="translate(300,125)">
    <circle r="38" fill="#0f2747" stroke="#34d399" stroke-width="3" />
    <ellipse rx="38" ry="15" fill="none" stroke="#14b8a6" stroke-width="2" />
    <ellipse rx="18" ry="38" fill="none" stroke="#14b8a6" stroke-width="2" />
    <line x1="-38" y1="0" x2="38" y2="0" stroke="#34d399" stroke-width="1.5" />
  </g>

  <!-- Left Switch Node -->
  <g transform="translate(165,205)">
    <polygon points="0,-28 48,0 0,28 -48,0" fill="url(#nodeTop)" />
    <polygon points="-48,0 0,28 0,52 -48,24" fill="#0d9488" />
    <polygon points="48,0 0,28 0,52 48,24" fill="url(#nodeSide)" stroke="#14b8a6" stroke-width="1.5" />
    <circle cx="-16" cy="22" r="3" fill="#fbbf24" />
    <circle cx="-6" cy="28" r="3" fill="#34d399" />
  </g>

  <!-- Right Switch Node -->
  <g transform="translate(435,205)">
    <polygon points="0,-28 48,0 0,28 -48,0" fill="url(#nodeTop)" />
    <polygon points="-48,0 0,28 0,52 -48,24" fill="#0d9488" />
    <polygon points="48,0 0,28 0,52 48,24" fill="url(#nodeSide)" stroke="#14b8a6" stroke-width="1.5" />
    <circle cx="-16" cy="22" r="3" fill="#34d399" />
    <circle cx="-6" cy="28" r="3" fill="#fbbf24" />
  </g>

  <!-- Center Core Router (3D Isometric Cylinder + Antennas) -->
  <g transform="translate(300,280)">
    <path d="M-70,0 L-70,38 A70,36 0 0,0 70,38 L70,0 Z" fill="#0f2747" stroke="#34d399" stroke-width="2.5" />
    <ellipse cx="0" cy="0" rx="70" ry="36" fill="url(#nodeTop)" stroke="#a7f3d0" stroke-width="2" />
    <!-- Router crossing arrows -->
    <path d="M-32,-6 L-8,-6 L-8,-14 L6,0 L-8,14 L-8,6 L-32,6 Z" fill="#071426" opacity="0.85" />
    <path d="M32,6 L8,6 L8,14 L-6,0 L8,-14 L8,-6 L32,-6 Z" fill="#071426" opacity="0.85" />
    <!-- Gold LEDs -->
    <circle cx="-38" cy="26" r="4" fill="#fbbf24" filter="url(#glow)" />
    <circle cx="-22" cy="31" r="4" fill="#34d399" filter="url(#glow)" />
    <circle cx="-6" cy="34" r="4" fill="#34d399" filter="url(#glow)" />
    <circle cx="12" cy="34" r="4" fill="#fbbf24" filter="url(#glow)" />
    <!-- Antennas -->
    <line x1="-45" y1="-15" x2="-55" y2="-65" stroke="url(#goldAccent)" stroke-width="6" stroke-linecap="round" />
    <circle cx="-55" cy="-65" r="7" fill="#fbbf24" filter="url(#glow)" />
    <line x1="45" y1="-15" x2="55" y2="-65" stroke="url(#goldAccent)" stroke-width="6" stroke-linecap="round" />
    <circle cx="55" cy="-65" r="7" fill="#fbbf24" filter="url(#glow)" />
  </g>

  <!-- Bottom-Left Server Rack Node -->
  <g transform="translate(165,375)">
    <polygon points="0,-28 48,0 0,28 -48,0" fill="url(#nodeTop)" />
    <polygon points="-48,0 0,28 0,56 -48,28" fill="#0d9488" />
    <polygon points="48,0 0,28 0,56 48,28" fill="url(#nodeSide)" stroke="#14b8a6" stroke-width="1.5" />
    <circle cx="14" cy="30" r="3.5" fill="#34d399" />
    <circle cx="26" cy="23" r="3.5" fill="#fbbf24" />
  </g>

  <!-- Bottom-Right Server Rack Node -->
  <g transform="translate(435,375)">
    <polygon points="0,-28 48,0 0,28 -48,0" fill="url(#nodeTop)" />
    <polygon points="-48,0 0,28 0,56 -48,28" fill="#0d9488" />
    <polygon points="48,0 0,28 0,56 48,28" fill="url(#nodeSide)" stroke="#14b8a6" stroke-width="1.5" />
    <circle cx="14" cy="30" r="3.5" fill="#fbbf24" />
    <circle cx="26" cy="23" r="3.5" fill="#34d399" />
  </g>

  <!-- Bottom Wi-Fi / Signal Beacon -->
  <g transform="translate(300,455)">
    <polygon points="0,-24 42,0 0,24 -42,0" fill="url(#goldAccent)" />
    <polygon points="-42,0 0,24 0,44 -42,20" fill="#b45309" />
    <polygon points="42,0 0,24 0,44 42,20" fill="#78350f" />
    <path d="M-20,-34 A28,28 0 0,1 20,-34" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" />
    <path d="M-32,-46 A45,45 0 0,1 32,-46" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" opacity="0.65" />
  </g>
</svg>
