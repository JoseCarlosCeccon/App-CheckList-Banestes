<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bgSec" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#13305a" />
      <stop offset="65%" stop-color="#0b1f3a" />
      <stop offset="100%" stop-color="#071426" />
    </radialGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shieldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="55%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13305a" />
      <stop offset="100%" stop-color="#071426" />
    </linearGradient>
    <linearGradient id="goldLock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgSec)" />
  <circle cx="300" cy="290" r="245" fill="url(#shieldGlow)" />

  <!-- Orbiting cyber defense rings -->
  <ellipse cx="300" cy="310" rx="235" ry="92" fill="none" stroke="#14b8a6" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="10 8" />
  <ellipse cx="300" cy="310" rx="195" ry="72" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="2" />

  <!-- Floating encrypted 3D data cubes -->
  <g transform="translate(110,175)">
    <polygon points="0,-24 38,0 0,24 -38,0" fill="#34d399" />
    <polygon points="-38,0 0,24 0,62 -38,38" fill="#0d9488" />
    <polygon points="38,0 0,24 0,62 38,38" fill="#0f2747" stroke="#34d399" stroke-width="1.5" />
  </g>
  <g transform="translate(490,175)">
    <polygon points="0,-24 38,0 0,24 -38,0" fill="#fbbf24" />
    <polygon points="-38,0 0,24 0,62 -38,38" fill="#d97706" />
    <polygon points="38,0 0,24 0,62 38,38" fill="#78350f" stroke="#fde68a" stroke-width="1.5" />
  </g>
  <g transform="translate(115,415)">
    <polygon points="0,-20 32,0 0,20 -32,0" fill="#14b8a6" />
    <polygon points="-32,0 0,20 0,52 -32,32" fill="#0f766e" />
    <polygon points="32,0 0,20 0,52 32,32" fill="#0f2747" stroke="#14b8a6" stroke-width="1.5" />
  </g>

  <!-- Isometric 3D Shield Base -->
  <g filter="url(#softGlow)">
    <path
      d="M300,95 L445,155 L445,285 C445,385 375,455 300,495 C225,455 155,385 155,285 L155,155 Z"
      fill="url(#shieldOuter)"
      stroke="#a7f3d0"
      stroke-width="3"
    />
  </g>
  <path
    d="M300,118 L422,170 L422,282 C422,368 362,430 300,466 C238,430 178,368 178,282 L178,170 Z"
    fill="url(#shieldInner)"
    stroke="#10b981"
    stroke-width="2"
  />

  <!-- Fingerprint / Biometric arcs behind padlock -->
  <g fill="none" stroke="#14b8a6" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M215,260 A85,85 0 0,1 385,260" />
    <path d="M200,285 A105,105 0 0,1 400,285" />
    <path d="M225,355 A90,90 0 0,0 375,355" />
  </g>

  <!-- 3D Golden Padlock inside Shield -->
  <g transform="translate(300,295)">
    <!-- Shackle -->
    <path
      d="M-38,-22 L-38,-56 A38,38 0 0,1 38,-56 L38,-22"
      fill="none"
      stroke="url(#goldLock)"
      stroke-width="16"
      stroke-linecap="round"
    />
    <!-- Lock body -->
    <rect
      x="-62"
      y="-22"
      width="124"
      height="102"
      rx="20"
      fill="url(#goldLock)"
      stroke="#fef3c7"
      stroke-width="2.5"
    />
    <!-- Keyhole -->
    <circle cx="0" cy="20" r="13" fill="#071426" />
    <path d="M-6,26 L6,26 L9,52 L-9,52 Z" fill="#071426" />
  </g>

  <!-- Floating Golden Digital Key (bottom right) -->
  <g transform="translate(475,425) rotate(-30)">
    <circle cx="-32" cy="0" r="22" fill="none" stroke="url(#goldLock)" stroke-width="10" />
    <rect x="-10" y="-5" width="66" height="10" rx="5" fill="url(#goldLock)" />
    <rect x="30" y="5" width="10" height="14" rx="2" fill="url(#goldLock)" />
    <rect x="46" y="5" width="10" height="18" rx="2" fill="url(#goldLock)" />
  </g>
</svg>
